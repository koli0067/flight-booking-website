<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Web Design Mastery | SKYWINGS</title>
</head>
<body>
    <header>
        <div class="nav_header">
                <div class="nav_logo">
                    <h2>Skywings</h2>
                </div>
                <div class="nav_manu_btn">
                    <i class="fa-solid fa-bars"></i>
                    <i class="fa-solid fa-xmark"></i>
                </div>

        </div>
        <ul class="nav_link" id="nav_link">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#tour">Tour</a></li>
            <li><a href="#package">Package</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a class="book-trip" href="#">Book Trip</a></li>
        </ul>
        <div class="nav_btn">
            <button class="btn">BOOK TRIP</button>
        </div>
    </header>

    <section class="hero_section">
        <div class="hero_area">
            <div class="hero_text_area">
                <h4>ELEVATE YOUR TRAVEL JOURNEY</h4>
                <h2>Experience The Magic Of Flight!</h2>
                <div class="hero_area_btn">
                    <button>Book a trip now</button>
                    <i class="fa-solid fa-circle-play"></i>
                </div>
            </div>
            <div class="hero_img">
                <img src="./images/header.png" alt="">
            </div>
        </div>

    </section>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="./script.js"></script>
</body>
</html>
